[package]
name = "confaudit"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Prabesh Sharma"]
description = "Audit nginx, sshd and Docker configuration files for settings that weaken security"
license = "MIT"
repository = "https://github.com/hellpuffyt/confaudit"
readme = "README.md"
keywords = ["security", "audit", "nginx", "sshd", "docker"]
categories = ["command-line-utilities"]

[[bin]]
name = "confaudit"
path = "src/main.rs"

[dependencies]
clap = { version = "~4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
