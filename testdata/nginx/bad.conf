# Intentionally insecure nginx config used as a fixture for confaudit's
# tests and CI smoke checks. Do not deploy this file.
http {
    server_tokens on;
    client_max_body_size 0;

    server {
        listen 80;
        server_name example.com;

        location / {
            autoindex on;
            proxy_pass http://backend;
        }

        location /files {
            alias /data/files;
        }

        location /api {
            if ($request_method = POST) {
                proxy_pass http://backend;
            }
        }
    }

    server {
        listen 443 ssl;
        server_name secure.example.com;
        ssl_certificate /etc/ssl/certs/fake-cert.pem;
        ssl_certificate_key /etc/ssl/private/fake-key.pem;
        ssl_protocols TLSv1 TLSv1.1;
        ssl_ciphers RC4-SHA:MD5;
    }
}
